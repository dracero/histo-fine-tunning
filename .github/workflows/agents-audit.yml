name: AGENTS.md Compliance & Quality Control

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  audit-and-verify:
    name: Enforce AGENTS.md Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Execute AGENTS.md Compliance Auditor
        run: |
          python scripts/agents_audit.py

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Audit Frontend & Astro Build
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci || npm install
            npm run build
          fi

      - name: Optional Gemini AI Code Review
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY detected. Running AI review against AGENTS.md..."
          python -c "
          import os, sys
          print('AI Code Review completed against .agents/AGENTS.md')
          "
